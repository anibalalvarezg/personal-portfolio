<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a"/>
      <stop offset="50%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#0a0a0a"/>
    </linearGradient>
    <radialGradient id="glow1" cx="30%" cy="30%" r="50%">
      <stop offset="0%" style="stop-color:rgba(6,182,212,0.3)"/>
      <stop offset="100%" style="stop-color:rgba(6,182,212,0)"/>
    </radialGradient>
    <radialGradient id="glow2" cx="70%" cy="70%" r="50%">
      <stop offset="0%" style="stop-color:rgba(59,130,246,0.2)"/>
      <stop offset="100%" style="stop-color:rgba(59,130,246,0)"/>
    </radialGradient>
  </defs>
  
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>
  
  <!-- Grid dots pattern -->
  <g opacity="0.1">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1" fill="#06b6d4"/>
    </pattern>
    <rect width="1200" height="630" fill="url(#grid)"/>
  </g>
  
  <!-- Title -->
  <text x="600" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="#e2e8f0" letter-spacing="-2">
    Aníbal Álvarez
  </text>

  <!-- Subtitle -->
  <text x="600" y="370" text-anchor="middle" font-family="monospace" font-size="28" fill="#94a3b8">
    Frontend Developer • Ingeniero Civil en Informática • Chile
  </text>
  
  <!-- Tech stack -->
  <text x="600" y="480" text-anchor="middle" font-family="monospace" font-size="20" fill="#06b6d4">
    Angular • TypeScript • Python • Scrapy • AWS • Docker • Redis
  </text>
  
  <!-- Bottom line -->
  <rect x="400" y="540" width="400" height="3" rx="1.5" fill="url(#glow1)" opacity="0.5"/>
  
  <!-- Logo mark -->
  <text x="600" y="590" text-anchor="middle" font-family="monospace" font-size="16" fill="#64748b">
    &lt;anibal.alvarez.dev/&gt;
  </text>
</svg>
